<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    overflow: hidden;
}
.splash-container { text-align: center; color: white; }
.splash-icon {
    width: 80px; height: 80px; margin: 0 auto 24px;
    background: rgba(255,255,255,0.2); border-radius: 20px;
    display: flex; justify-content: center; align-items: center;
    font-size: 40px;
}
.splash-title {
    font-size: 28px; font-weight: 700;
    margin-bottom: 8px; letter-spacing: 2px;
}
.splash-subtitle {
    font-size: 14px; opacity: 0.8; margin-bottom: 40px;
}
.progress-wrapper { width: 320px; margin: 0 auto; }
.progress-bar-bg {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px; overflow: hidden;
}
.progress-bar-fill {
    height: 100%; width: 0%;
    background: white; border-radius: 3px;
    transition: width 0.5s ease;
}
.progress-text {
    margin-top: 16px; font-size: 13px; opacity: 0.9;
}
.progress-pct {
    margin-top: 8px; font-size: 12px; opacity: 0.6;
}
.error-text { color: #ff6b6b !important; opacity: 1 !important; }
</style>
</head>
<body>
<div class="splash-container">
    <div class="splash-icon">&#127970;</div>
    <div class="splash-title">{{SYSTEM_TITLE}}</div>
    <div class="splash-subtitle">系统启动中，请稍候...</div>
    <div class="progress-wrapper">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>
    <div class="progress-text" id="progressText">正在初始化...</div>
    <div class="progress-pct" id="progressPct">0%</div>
</div>
<script>
function updateProgress(pct, msg) {
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = msg;
    document.getElementById('progressPct').textContent = pct + '%';
}
function showError(msg) {
    document.getElementById('progressText').textContent = '启动失败: ' + msg;
    document.getElementById('progressText').classList.add('error-text');
    document.getElementById('progressPct').textContent = '';
}
</script>
</body>
</html>

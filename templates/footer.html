<footer class="bg-transparent text-black py-4">
    <style>
        /* 设置body为flex布局，占据整个视口高度 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        
        /* 主内容区域自动扩展，将页脚推到底部 */
        main {
            flex: 1;
            margin-bottom: 0; /* 完全移除主内容区域底部的边距 */
        }
        
        /* 页脚样式 */
        footer {
            background-color: transparent;
            width: 100%;
            margin-top: -1.5rem !important; /* 增加负值上外边距，显著拉近与主内容的距离 */
        }
        
        /* 页脚文字颜色 */
        footer p {
            color: #000000;
        }
    </style>
    
    <div class="container mx-auto px-4 text-center text-sm py-1">
        <p class="text-gray-700 text-sm mt-2" id="currentTime"></p>
        <p>&copy;  <span id="currentYear"></span>  {{ system_title }} - 版权所有</p>
    </div>
    
</footer>
<script>
        // 设置北京时区时间
        function updateDateTime() {
            const now = new Date();
            // 北京时区 (UTC+8)
            const beijingTime = new Date(now.getTime());
            
            // 更新年份
            document.getElementById('currentYear').textContent = beijingTime.getUTCFullYear();
            
            // 格式化时间显示
            const options = { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false,
                timeZone: 'Asia/Shanghai'
            };
            document.getElementById('currentTime').textContent = beijingTime.toLocaleString('zh-CN', options);
        }
        
        // 初始化更新时间并设置定时器
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
    
    <script>
    // 将非项目持久化cookie转为会话级（第二层防御）
    // 这些cookie（stay_login/did/_SSID/_CrPoSt）可能由浏览器扩展设置，
    // 服务端after_request拦截器无法捕获客户端设置的cookie，
    // 因此需要客户端JS主动将其转为会话级（关闭浏览器即失效）
    (function() {
        'use strict';
        var TARGET_COOKIES = ['stay_login', 'did', '_SSID', '_CrPoSt'];
        
        function convertToSessionCookies() {
            var allCookies = document.cookie;
            if (!allCookies) return false;
            
            var cookiePairs = allCookies.split(';');
            var isSecure = window.location.protocol === 'https:';
            var converted = false;
            
            for (var i = 0; i < cookiePairs.length; i++) {
                var pair = cookiePairs[i].trim();
                var eqIndex = pair.indexOf('=');
                if (eqIndex === -1) continue;
                
                var name = pair.substring(0, eqIndex).trim();
                var value = pair.substring(eqIndex + 1);
                
                if (TARGET_COOKIES.indexOf(name) !== -1 && value) {
                    // 重新设置为会话级cookie（无expires/Max-Age）
                    // 效果与CRspli9ois会话级一致：关闭浏览器即失效
                    var cookieStr = name + '=' + value + '; path=/; SameSite=Lax';
                    if (isSecure) {
                        cookieStr += '; Secure';
                    }
                    document.cookie = cookieStr;
                    converted = true;
                    if (typeof console !== 'undefined' && console.log) {
                        console.log('[Cookie策略] 已将 ' + name + ' 转为会话级cookie');
                    }
                }
            }
            return converted;
        }
        
        // 页面加载时立即执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', convertToSessionCookies);
        } else {
            convertToSessionCookies();
        }
        
        // 定期检查（每60秒），防止扩展重新设置持久化cookie
        setInterval(convertToSessionCookies, 60000);
    })();
    </script>

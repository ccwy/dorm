<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include 'static.html' %}
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        accent: '#722ED1',
                    },
                }
            }
        }
    </script>
    <style>
        .table-compact thead th {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        .table-compact tbody td {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            white-space: nowrap;
        }
        .status-row {
            transition: all 0.3s ease;
        }
        .status-row.hidden-row {
            height: 0;
            padding: 0;
            border: none;
        }
        .status-row.hidden-row > td {
            padding: 0;
            height: 0;
            overflow: hidden;
        }
        html {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }
        .operation-tag {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .tag-allocate {
            background-color: #e6f7ee;
            color: #00875a;
        }
        .tag-change {
            background-color: #fff2e8;
            color: #d46b08;
        }
        .tag-swap {
            background-color: #f0f0ff;
            color: #722ED1;
        }
        .tag-checkout {
            background-color: #fff1f0;
            color: #cf1322;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
{% include 'header.html' %}
    <main class="container mx-auto px-4 py-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
            <div class="flex items-center">
                <button onclick="window.location.href='{{ url_for('dorm.manage') }}'" class="text-primary hover:text-primary/80 mr-2">
                    <i class="fa fa-arrow-left"></i>
                </button>
                <h2 class="text-2xl font-semibold text-gray-800">{{ title }}</h2>
            </div>
            <div>
                <button id="exportBtn" class="px-4 py-2 bg-secondary text-white rounded-md hover:bg-secondary/90">
                    <i class="fa fa-download mr-2"></i>导出记录
                </button>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6 max-w-full mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <!-- 关键词搜索（姓名/房间号） -->
                <div class="min-w-[140px]">
                    <label for="searchKeyword" class="block text-sm font-medium text-gray-700 mb-1">姓名/房间号</label>
                    <input type="text" id="searchKeyword" placeholder="输入姓名或房间号"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                <!-- 操作类型筛选 -->
                <div class="min-w-[120px]">
                    <label for="filterOperation" class="block text-sm font-medium text-gray-700 mb-1">操作类型</label>
                    <select id="filterOperation" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="">所有操作</option>
                        <option value="allocate">分配入住</option>
                        <option value="change">更换宿舍</option>
                        <option value="swap">互换宿舍</option>
                        <option value="checkout">退宿</option>
                    </select>
                </div>
                <!-- 开始日期 -->
                <div class="min-w-[140px]">
                    <label for="dateFrom" class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
                    <input type="date" id="dateFrom"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                <!-- 结束日期 -->
                <div class="min-w-[140px]">
                    <label for="dateTo" class="block text-sm font-medium text-gray-700 mb-1">结束日期</label>
                    <input type="date" id="dateTo"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                <!-- 按钮区域 -->
                <div class="min-w-[120px] grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 invisible">操作</label>
                        <button id="resetFilter" class="w-full px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                            <i class="fa fa-refresh mr-1"></i> 重置
                        </button>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 invisible">查询</label>
                        <button id="searchBtn" class="w-full px-6 py-2 bg-primary text-white rounded-md hover:bg-primary/90">
                            <i class="fa fa-search mr-2"></i>查询
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作记录表格 -->
        <div class="bg-white rounded-lg shadow-sm p-6 max-w-full mx-auto">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 table-compact">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">序号</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作时间</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作人</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">涉及人员</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">宿舍信息</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作类型</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">入住时间</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">退宿日期</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">住宿天数</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">备注</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="bg-white divide-y divide-gray-200">
                        <tr id="statusRow" class="status-row">
                            <td colspan="10" class="px-6 py-4">
                                <div id="loadingIndicator" class="py-6 flex justify-center items-center hidden">
                                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                                    <span class="ml-3 text-gray-600">加载住宿记录中...</span>
                                </div>
                                <div id="emptyState" class="py-10 flex flex-col items-center justify-center hidden">
                                    <i class="fa fa-file-text-o text-gray-300 text-5xl mb-4"></i>
                                    <p class="text-gray-500">当前没有住宿操作记录</p>
                                </div>
                                <div id="filterNoResultState" class="py-10 flex flex-col items-center justify-center hidden">
                                    <i class="fa fa-filter text-gray-300 text-5xl mb-4"></i>
                                    <p class="text-gray-500">没有找到符合筛选条件的操作记录</p>
                                    <button id="tryResetBtn" class="mt-3 px-4 py-1 border border-primary text-primary rounded-md hover:bg-primary/5">
                                        重置筛选条件
                                    </button>
                                </div>
                                <div id="errorState" class="py-10 text-center text-red-500 hidden">
                                    <i class="fa fa-exclamation-circle mr-2"></i>
                                    <span id="errorMessage">数据加载失败，请重试</span>
                                    <button id="retryBtn" class="mt-3 px-4 py-1 border border-primary text-primary rounded-md hover:bg-primary/5">
                                        重新加载
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页控件（参照房间管理页面样式） -->
            <div id="paginationArea" class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between mt-4 gap-4" style="display:none;">
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <div class="text-sm text-gray-700">
                        显示 <span id="showStart" class="font-medium">1</span> 到 <span id="showEnd" class="font-medium">20</span> 条，共 <span id="totalCount" class="font-medium">0</span> 条记录
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-gray-700">每页显示：</span>
                        <select id="pageSizeSelect" class="px-2 py-1 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                            <option value="10">10条/页</option>
                            <option value="20" selected>20条/页</option>
                            <option value="50">50条/页</option>
                            <option value="100">100条/页</option>
                        </select>
                    </div>
                </div>
                <div id="pageButtons" class="flex space-x-1"></div>
            </div>
        </div>
    </main>

    {% include 'footer.html' %}

    <script>
        // 全局变量
        let currentPage = 1;
        let pageSize = 20;
        let totalPages = 1;
        let totalRecordsCount = 0;

        // 设置日期默认值
        function setDefaultDates() {
            const today = new Date();
            const oneMonthAgo = new Date(today);
            oneMonthAgo.setMonth(oneMonthAgo.getMonth() - 1);
            
            const formatDate = (d) => d.toISOString().slice(0, 10);
            document.getElementById('dateFrom').value = formatDate(oneMonthAgo);
            document.getElementById('dateTo').value = formatDate(today);
        }

        // 生成分页按钮（与房间管理页面一致）
        function generatePageRange(current, total, showPages) {
            showPages = showPages || 5;
            if (total <= showPages) return Array.from({length: total}, (_, i) => i + 1);
            const half = Math.floor(showPages / 2);
            let start = Math.max(1, current - half);
            let end = Math.min(total, start + showPages - 1);
            if (end - start < showPages - 1) start = Math.max(1, end - showPages + 1);
            const pages = [];
            if (start > 1) {
                pages.push(1);
                if (start > 2) pages.push('...');
            }
            for (let i = start; i <= end; i++) pages.push(i);
            if (end < total) {
                if (end < total - 1) pages.push('...');
                pages.push(total);
            }
            return pages;
        }

        // 页面加载初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 设置日期默认值
            setDefaultDates();

            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchKeyword').addEventListener('keyup', (e) => e.key === 'Enter' && handleSearch());
            document.getElementById('filterOperation').addEventListener('change', handleSearch);
            document.getElementById('resetFilter').addEventListener('click', resetFilters);
            document.getElementById('tryResetBtn').addEventListener('click', resetFilters);
            document.getElementById('retryBtn').addEventListener('click', () => fetchRecords(1));
            document.getElementById('exportBtn').addEventListener('click', exportRecords);
            document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
                pageSize = parseInt(e.target.value);
                currentPage = 1;
                fetchRecords(1);
            });

            // 初始加载
            fetchRecords(1);
        });

        function handleSearch() {
            currentPage = 1;
            fetchRecords(1);
        }

        /**
         * 从后端API获取住宿操作记录
         */
        async function fetchRecords(page) {
            showLoading();
            clearTable();

            try {
                const keyword = document.getElementById('searchKeyword').value.trim();
                const params = new URLSearchParams({
                    page: page,
                    per_page: pageSize,
                    user_name: keyword,
                    room_number: keyword,
                    operation_type: document.getElementById('filterOperation').value,
                    date_from: document.getElementById('dateFrom').value,
                    date_to: document.getElementById('dateTo').value
                });

                const response = await fetch("{{ url_for('dorm.get_dorm_records') }}?" + params.toString(), {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (!response.ok) throw new Error(`HTTP错误: ${response.status}`);

                const result = await response.json();
                if (!result.success) throw new Error(result.error || '获取数据失败');

                const data = result.data;
                currentPage = data.page;
                totalPages = data.pages;
                totalRecordsCount = data.total;

                renderRecords(data.records, page, pageSize);
                updatePagination();

                if (data.records.length === 0 && totalRecordsCount === 0) {
                    showEmptyState();
                } else if (data.records.length === 0) {
                    showFilterNoResultState();
                }

            } catch (error) {
                console.error('获取住宿记录失败:', error);
                document.getElementById('errorMessage').textContent = `数据加载失败: ${error.message}`;
                showErrorState();
            } finally {
                hideLoading();
            }
        }

        /**
         * 渲染记录表格
         */
        function renderRecords(records, page, perPage) {
            const tableBody = document.getElementById('logTableBody');
            const statusRow = document.getElementById('statusRow');

            Array.from(tableBody.children).forEach(child => {
                if (child.id !== 'statusRow') tableBody.removeChild(child);
            });

            if (records.length > 0) {
                statusRow.classList.add('hidden-row');
                ['loadingIndicator', 'emptyState', 'filterNoResultState', 'errorState'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
            } else {
                statusRow.classList.remove('hidden-row');
                return;
            }

            const startIndex = (page - 1) * perPage;
            const fragment = document.createDocumentFragment();

            records.forEach((record, idx) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';

                let tagClass = '';
                switch(record.operation_type) {
                    case 'allocate': tagClass = 'tag-allocate'; break;
                    case 'change': tagClass = 'tag-change'; break;
                    case 'swap': tagClass = 'tag-swap'; break;
                    case 'checkout': tagClass = 'tag-checkout'; break;
                }

                let remarkContent = record.remarks || '-';
                if (record.swap_with) {
                    remarkContent = `与${record.swap_with}互换` + (record.remarks && record.remarks !== '-' ? `；${record.remarks}` : '');
                }

                row.innerHTML = `
                    <td class="px-6 py-3 whitespace-nowrap font-medium">${startIndex + idx + 1}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${record.operation_time}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-900">${record.operator}</td>
                    <td class="px-6 py-3 whitespace-nowrap">
                        <a href="${'/user/view/' + record.user_id}" class="text-primary hover:underline font-medium">${record.user_name}</a>
                    </td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${record.room_info}</td>
                    <td class="px-6 py-3 whitespace-nowrap">
                        <span class="operation-tag ${tagClass}">${record.operation_type_text}</span>
                    </td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${record.check_in_date}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${record.check_out_date === '-' ? '-' : record.check_out_date}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${record.stay_days}天</td>
                    <td class="px-6 py-3 text-sm text-gray-500" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${remarkContent}">${remarkContent}</td>
                `;

                fragment.appendChild(row);
            });

            tableBody.appendChild(fragment);
        }

        /**
         * 更新分页控件（参照房间管理页面样式）
         */
        function updatePagination() {
            const paginationArea = document.getElementById('paginationArea');
            if (totalRecordsCount === 0) {
                paginationArea.style.display = 'none';
                return;
            }
            paginationArea.style.display = '';

            // 更新显示范围
            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalRecordsCount);
            document.getElementById('showStart').textContent = start;
            document.getElementById('showEnd').textContent = end;
            document.getElementById('totalCount').textContent = totalRecordsCount;

            // 生成分页按钮
            const pageButtons = document.getElementById('pageButtons');
            pageButtons.innerHTML = '';

            // 上一页按钮
            const prevBtn = document.createElement('button');
            prevBtn.className = `px-3 py-1 border border-gray-300 rounded bg-white text-gray-500 hover:bg-gray-50 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}`;
            prevBtn.innerHTML = '<i class="fa fa-chevron-left"></i>';
            if (currentPage > 1) {
                prevBtn.onclick = () => fetchRecords(currentPage - 1);
            }
            pageButtons.appendChild(prevBtn);

            // 页码按钮
            const pageRange = generatePageRange(currentPage, totalPages);
            pageRange.forEach(p => {
                const btn = document.createElement('button');
                if (p === '...') {
                    btn.className = 'px-3 py-1 border border-gray-300 rounded bg-white text-gray-700';
                    btn.textContent = '...';
                    btn.disabled = true;
                } else {
                    btn.className = `px-3 py-1 border ${p === currentPage ? 'border-primary bg-primary text-white' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'} rounded`;
                    btn.textContent = p;
                    btn.onclick = () => fetchRecords(p);
                }
                pageButtons.appendChild(btn);
            });

            // 下一页按钮
            const nextBtn = document.createElement('button');
            nextBtn.className = `px-3 py-1 border border-gray-300 rounded bg-white text-gray-500 hover:bg-gray-50 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}`;
            nextBtn.innerHTML = '<i class="fa fa-chevron-right"></i>';
            if (currentPage < totalPages) {
                nextBtn.onclick = () => fetchRecords(currentPage + 1);
            }
            pageButtons.appendChild(nextBtn);
        }

        /**
         * 重置筛选条件
         */
        function resetFilters() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('filterOperation').value = '';
            setDefaultDates();
            currentPage = 1;
            fetchRecords(1);
        }

        /**
         * 导出记录为CSV
         */
        function exportRecords() {
            if (totalRecordsCount === 0) {
                alert('没有可导出的记录');
                return;
            }

            const exportBtn = document.getElementById('exportBtn');
            const originalText = exportBtn.innerHTML;
            exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>导出中...';
            exportBtn.disabled = true;

            const keyword = document.getElementById('searchKeyword').value.trim();
            const params = new URLSearchParams({
                page: 1,
                per_page: totalRecordsCount > 10000 ? 10000 : totalRecordsCount,
                user_name: keyword,
                room_number: keyword,
                operation_type: document.getElementById('filterOperation').value,
                date_from: document.getElementById('dateFrom').value,
                date_to: document.getElementById('dateTo').value
            });

            fetch("{{ url_for('dorm.get_dorm_records') }}?" + params.toString(), {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => response.json())
            .then(result => {
                if (!result.success) throw new Error(result.error || '导出失败');

                const records = result.data.records;
                const headers = ['序号','操作时间','操作人','涉及人员','宿舍信息','操作类型','入住时间','退宿日期','住宿天数','备注'];
                const rows = records.map((r, i) => [
                    i + 1,
                    r.operation_time,
                    r.operator,
                    r.user_name,
                    r.room_info,
                    r.operation_type_text,
                    r.check_in_date,
                    r.check_out_date,
                    r.stay_days + '天',
                    r.swap_with ? `与${r.swap_with}互换` : (r.remarks || '-')
                ].map(v => String(v).includes(',') ? `"${v}"` : v).join(','));

                const csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `住宿操作记录_${new Date().toISOString().slice(0,10)}.csv`;
                a.style.visibility = 'hidden';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            })
            .catch(error => {
                alert('导出失败: ' + error.message);
            })
            .finally(() => {
                exportBtn.innerHTML = originalText;
                exportBtn.disabled = false;
            });
        }

        // 状态显示控制函数
        function showLoading() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            document.getElementById('loadingIndicator').classList.remove('hidden');
            ['emptyState', 'filterNoResultState', 'errorState'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }

        function showEmptyState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            document.getElementById('emptyState').classList.remove('hidden');
            ['loadingIndicator', 'filterNoResultState', 'errorState'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        function showFilterNoResultState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            document.getElementById('filterNoResultState').classList.remove('hidden');
            ['loadingIndicator', 'emptyState', 'errorState'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        function showErrorState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            document.getElementById('errorState').classList.remove('hidden');
            ['loadingIndicator', 'emptyState', 'filterNoResultState'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        function clearTable() {
            const tableBody = document.getElementById('logTableBody');
            Array.from(tableBody.children).forEach(child => {
                if (child.id !== 'statusRow') tableBody.removeChild(child);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <!--本地化CDN-->
{% include 'static.html' %}


    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        accent: '#722ED1',
                    },
                }
            }
        }
    </script>
    <style>
        .table-compact thead th {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        .table-compact tbody td {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            white-space: nowrap;
        }
        .status-row {
            transition: all 0.3s ease;
        }
        .status-row.hidden-row {
            height: 0;
            padding: 0;
            border: none;
        }
        .status-row.hidden-row > td {
            padding: 0;
            height: 0;
            overflow: hidden;
        }
        
        html {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        footer {
            margin-top: auto;
        }

        .operation-tag {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .tag-allocate {
            background-color: #e6f7ee;
            color: #00875a;
        }
        .tag-change {
            background-color: #fff2e8;
            color: #d46b08;
        }
        .tag-swap {
            background-color: #fff2e8;
            color: #d46b08;
        }
        .tag-checkout {
            background-color: #fff1f0;
            color: #cf1322;
        }
        .tag-edit {
            background-color: #e8f3ff;
            color: #1890ff;
        }
        
        .result-tag {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .result-success {
            background-color: #e6f7ee;
            color: #00875a;
        }
        .result-fail {
            background-color: #fff1f0;
            color: #cf1322;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 页头 -->

        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">
                <a href="{{ url_for('index') }}" class="flex items-center">
                    <i class="fa fa-arrow-left mr-2"></i>
                    {{ Config.SYSTEM_TITLE }}
                </a>
            </h1>
            <div class="text-sm" id="currentTime"></div>
        </div>
    </header>-->
{% include 'header.html' %}
    <!-- 主体内容 -->
    <main class="container mx-auto px-4 py-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
            <div class="flex items-center">
                <button onclick="window.location.href='{{ url_for('dorm.manage') }}'" class="text-primary hover:text-primary/80 mr-2">
                    <i class="fa fa-arrow-left"></i>
                </button>
                <h2 class="text-2xl font-semibold text-gray-800">{{ title }}</h2>
            </div>
            <div>
                <button id="exportBtn" class="px-4 py-2 bg-secondary text-white rounded-md hover:bg-secondary/90">
                    <i class="fa fa-download mr-2"></i>导出记录
                </button>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6 max-w-full mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                <!-- 人员姓名筛选 -->
                <div class="min-w-[120px]">
                    <label for="searchUserName" class="block text-sm font-medium text-gray-700 mb-1">人员姓名</label>
                    <input type="text" id="searchUserName" placeholder="输入人员姓名" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                
                <!-- 房间号筛选 -->
                <div class="min-w-[120px]">
                    <label for="searchRoom" class="block text-sm font-medium text-gray-700 mb-1">房间号</label>
                    <input type="text" id="searchRoom" placeholder="输入房间号" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                
                <!-- 操作类型筛选 -->
                <div class="min-w-[120px]">
                    <label for="filterOperation" class="block text-sm font-medium text-gray-700 mb-1">操作类型</label>
                    <select id="filterOperation" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="">所有操作</option>
                        <option value="allocate">分配入住</option>
                        <option value="change">更换宿舍</option>
                        <option value="swap">调换宿舍</option>
                        <option value="checkout">退宿</option>
                        <option value="edit">信息修改</option>
                    </select>
                </div>
                
                <!-- 操作结果筛选 -->
                <div class="min-w-[120px]">
                    <label for="filterResult" class="block text-sm font-medium text-gray-700 mb-1">操作结果</label>
                    <select id="filterResult" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                        <option value="">所有结果</option>
                        <option value="success">成功</option>
                        <option value="fail">失败</option>
                    </select>
                </div>
                
                <!-- 日期范围筛选 -->
                <div class="min-w-[120px]">
                    <label for="dateRange" class="block text-sm font-medium text-gray-700 mb-1">操作日期</label>
                    <input type="text" id="dateRange" placeholder="选择日期范围" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50">
                </div>
                
                <!-- 按钮区域 -->
                <div class="min-w-[120px] grid grid-cols-2 gap-2">
                    <!-- 重置按钮 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 invisible">操作</label>
                        <button id="resetFilter" class="w-full px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                            <i class="fa fa-refresh mr-1"></i> 重置
                        </button>
                    </div>
                    
                    <!-- 查询按钮 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1 invisible">查询</label>
                        <button id="searchBtn" class="w-full px-6 py-2 bg-primary text-white rounded-md hover:bg-primary/90">
                            <i class="fa fa-search mr-2"></i>查询
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作记录表格 -->
        <div class="bg-white rounded-lg shadow-sm p-6 max-w-full mx-auto">
            <!-- 数据表格 -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 table-compact">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作时间</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作人</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">涉及人员</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">原房间</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">新房间</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作类型</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">操作结果</th>
                            <th scope="col" class="px-6 py-3 text-left text-base font-bold text-gray-700 uppercase tracking-wider">备注</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- 状态提示区域 -->
                        <tr id="statusRow" class="status-row">
                            <td colspan="9" class="px-6 py-4">
                                <!-- 加载状态 -->
                                <div id="loadingIndicator" class="py-6 flex justify-center items-center hidden">
                                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                                    <span class="ml-3 text-gray-600">加载操作记录数据中...</span>
                                </div>
                                
                                <!-- 空状态（无任何记录） -->
                                <div id="emptyState" class="py-10 flex flex-col items-center justify-center hidden">
                                    <i class="fa fa-file-text-o text-gray-300 text-5xl mb-4"></i>
                                    <p class="text-gray-500">当前没有住宿操作记录</p>
                                </div>
                                
                                <!-- 筛选无结果状态 -->
                                <div id="filterNoResultState" class="py-10 flex flex-col items-center justify-center hidden">
                                    <i class="fa fa-filter text-gray-300 text-5xl mb-4"></i>
                                    <p class="text-gray-500">没有找到符合筛选条件的操作记录</p>
                                    <button id="tryResetBtn" class="mt-3 px-4 py-1 border border-primary text-primary rounded-md hover:bg-primary/5">
                                        重置筛选条件
                                    </button>
                                </div>
                                
                                <!-- 错误状态 -->
                                <div id="errorState" class="py-10 text-center text-red-500 hidden">
                                    <i class="fa fa-exclamation-circle mr-2"></i>
                                    <span id="errorMessage">数据加载失败，请重试</span>
                                    <button id="retryBtn" class="mt-3 px-4 py-1 border border-primary text-primary rounded-md hover:bg-primary/5">
                                        重新加载
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页控件 -->
            <div class="flex justify-between items-center mt-6">
                <div class="text-sm text-gray-500">
                    共 <span id="totalCount" class="font-medium text-primary">0</span> 条记录
                </div>
                <div class="flex space-x-2">
                    <button id="prevPage" class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50" disabled>
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <button id="currentPageBtn" class="px-3 py-1 bg-primary text-white rounded-md">1</button>
                    <button id="nextPage" class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50" disabled>
                        <i class="fa fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    {% include 'footer.html' %}
    

    <script>
        // 全局变量
        let operationLogs = [];
        let filteredLogs = [];
        let currentPage = 1;
        const pageSize = 15;
        let totalPages = 1;
        let totalRecordsCount = 0;

        // 页面加载初始化
        document.addEventListener('DOMContentLoaded', () => {
            
            // 绑定事件处理
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchUserName').addEventListener('keyup', (e) => e.key === 'Enter' && handleSearch());
            document.getElementById('searchRoom').addEventListener('keyup', (e) => e.key === 'Enter' && handleSearch());
            document.getElementById('filterOperation').addEventListener('change', handleSearch);
            document.getElementById('filterResult').addEventListener('change', handleSearch);
            document.getElementById('resetFilter').addEventListener('click', resetFilters);
            document.getElementById('tryResetBtn').addEventListener('click', resetFilters);
            document.getElementById('retryBtn').addEventListener('click', fetchOperationLogs);
            document.getElementById('exportBtn').addEventListener('click', exportLogs);
            
            // 分页按钮事件
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderLogs();
                }
            });
            
            document.getElementById('nextPage').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderLogs();
                }
            });
            
            // 初始加载数据
            fetchOperationLogs();
        });

        // 搜索处理函数
        function handleSearch() {
            currentPage = 1;
            // 显示加载状态前先固定页面高度，防止闪烁
            document.body.style.minHeight = `${document.body.offsetHeight}px`;
            filterLogs().then(() => {
                // 数据加载完成后解除高度固定
                setTimeout(() => {
                    document.body.style.minHeight = '';
                }, 100);
            });
        }

        /**
         * 获取所有操作记录数据 - 使用新API端点 /resident-details
         */
        async function fetchOperationLogs() {
            showLoading();
            clearTable();
            
            try {
                // 使用新API端点（对应后端的get_resident_details函数）
                const requestUrl = "{{ url_for('dorm.get_resident_details') }}";
                
                // 准备筛选参数（匹配后端API支持的筛选条件）
                const filterParams = {
                    user_id: '',
                    name: document.getElementById('searchUserName').value.trim(),
                    room_number: document.getElementById('searchRoom').value.trim(),
                    department: '',
                    gender: ''
                };
                
                // 发送请求
                const response = await fetch(requestUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify(filterParams)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP错误: ${response.status}，详情: ${errorText}`);
                }
                
                const apiResponse = await response.json();
                if (!apiResponse.success) throw new Error(apiResponse.message || '获取数据失败');
                
                // 处理新API返回的数据结构（将居民记录转换为操作日志格式）
                operationLogs = transformResidentDataToLogs(apiResponse.data.residents || []);
                totalRecordsCount = apiResponse.data.total || 0;
                
                // 应用筛选
                filterLogs();
                
            } catch (error) {
                console.error('获取数据失败:', error);
                document.getElementById('errorMessage').textContent = `数据加载失败: ${error.message}`;
                showErrorState();
            } finally {
                hideLoading();
            }
        }

        /**
         * 将新API返回的居民数据转换为表格所需的操作日志格式
         * 关键调整：分配宿舍操作使用created_at字段，退宿操作使用updated_at字段
         */
        function transformResidentDataToLogs(residents) {
            const logs = [];
            residents.forEach(resident => {
                // 处理当前住宿记录（分配入住操作）- 使用created_at作为操作时间
                logs.push({
                    id: resident.user.id,
                    // 优先使用创建时间，若无则回退到入住时间
                    operation_time: resident.current_dorm_created_at || resident.current_check_in,
                    operator: '系统',
                    user_name: resident.user.name,
                    user_id: resident.user.id,
                    old_room: '-',
                    new_room: resident.current_room.full_room,
                    operation_type: 'allocate',
                    result: 'success',
                    remark: `当前住宿天数: ${resident.current_stay_days}天`
                });
                
                // 处理历史住宿记录
                resident.history_rooms.forEach(history => {
                    if (!history.is_current && history.check_out_date) {
                        // 找到下一个入住记录作为新房间
                        const nextRoom = resident.history_rooms.find(
                            r => r.check_in_date > history.check_in_date && r.is_current
                        );
                        
                        // 确定操作类型和对应的时间字段
                        const operationType = nextRoom ? 'change' : 'checkout';
                        // 退宿操作使用updated_at，其他操作使用check_out_date
                        const operationTime = operationType === 'checkout' 
                            ? history.updated_at || history.check_out_date
                            : history.check_out_date;
                        
                        logs.push({
                            id: `${resident.user.id}-${history.dorm_id}`,
                            operation_time: operationTime,
                            operator: '系统',
                            user_name: resident.user.name,
                            user_id: resident.user.id,
                            old_room: history.room.full_room,
                            new_room: nextRoom ? nextRoom.room.full_room : '-',
                            operation_type: operationType,
                            result: 'success',
                            remark: `在此住宿: ${history.stay_days}天`
                        });
                    }
                });
            });
            
            // 按操作时间排序（最新的在前）
            return logs.sort((a, b) => new Date(b.operation_time) - new Date(a.operation_time));
        }

        /**
         * 筛选操作记录
         */
        async function filterLogs() {
            const userName = document.getElementById('searchUserName').value.trim().toLowerCase();
            const room = document.getElementById('searchRoom').value.trim().toLowerCase();
            const operationType = document.getElementById('filterOperation').value;
            const result = document.getElementById('filterResult').value;
            
            // 应用筛选条件
            filteredLogs = operationLogs.filter(log => {
                // 人员姓名筛选
                if (userName && !log.user_name.toLowerCase().includes(userName)) {
                    return false;
                }
                
                // 房间号筛选（原房间或新房间包含）
                if (room) {
                    const roomMatch = (log.old_room && log.old_room.toLowerCase().includes(room)) || 
                                     (log.new_room && log.new_room.toLowerCase().includes(room));
                    if (!roomMatch) return false;
                }
                
                // 操作类型筛选
                if (operationType && log.operation_type !== operationType) {
                    return false;
                }
                
                // 操作结果筛选
                if (result && log.result !== result) {
                    return false;
                }
                
                return true;
            });
            
            // 更新分页和渲染
            totalPages = Math.ceil(filteredLogs.length / pageSize);
            renderLogs();
            
            // 状态显示
            if (operationLogs.length === 0) {
                showEmptyState();
            } else if (filteredLogs.length === 0) {
                showFilterNoResultState();
            }
        }

        /**
         * 渲染操作记录表格
         */
        function renderLogs() {
            const tableBody = document.getElementById('logTableBody');
            const statusRow = document.getElementById('statusRow');
            
            // 清除现有数据行
            Array.from(tableBody.children).forEach(child => {
                if (child.id !== 'statusRow') tableBody.removeChild(child);
            });
            
            // 更新总记录数显示
            document.getElementById('totalCount').textContent = String(filteredLogs.length);
            
            // 控制状态行显示
            if (filteredLogs.length > 0) {
                statusRow.classList.add('hidden-row');
                ['loadingIndicator', 'emptyState', 'filterNoResultState', 'errorState'].forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                });
            } else {
                statusRow.classList.remove('hidden-row');
            }
            
            if (filteredLogs.length === 0) return;
            
            // 计算分页
            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = Math.min(startIndex + pageSize, filteredLogs.length);
            const currentPageData = filteredLogs.slice(startIndex, endIndex);
            
            // 更新分页按钮状态
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
            document.getElementById('currentPageBtn').textContent = currentPage;
            
            // 使用文档片段减少DOM重绘
            const fragment = document.createDocumentFragment();
            
            currentPageData.forEach((log) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                // 格式化时间
                const operationTime = log.operation_time 
                    ? new Date(log.operation_time).toLocaleString()
                    : '未知';
                
                // 确定操作类型标签样式
                let operationTagClass = '';
                switch(log.operation_type) {
                    case 'allocate':
                        operationTagClass = 'tag-allocate';
                        break;
                    case 'change':
                        operationTagClass = 'tag-change';
                        break;
                    case 'swap':
                        operationTagClass = 'tag-swap';
                        break;
                    case 'checkout':
                        operationTagClass = 'tag-checkout';
                        break;
                    case 'edit':
                        operationTagClass = 'tag-edit';
                        break;
                    default:
                        operationTagClass = '';
                }
                
                // 确定操作结果标签样式
                const resultTagClass = log.result === 'success' ? 'result-success' : 'result-fail';
                const resultText = log.result === 'success' ? '成功' : '失败';
                
                row.innerHTML = `
                    <td class="px-6 py-3 whitespace-nowrap font-medium">${log.id}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${operationTime}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-900">${log.operator || '系统'}</td>
                    <td class="px-6 py-3 whitespace-nowrap">
                        <div class="font-medium text-gray-900">${log.user_name}</div>
                        <div class="text-sm text-gray-500">ID: ${log.user_id}</div>
                    </td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${log.old_room || '-'}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">${log.new_room || '-'}</td>
                    <td class="px-6 py-3 whitespace-nowrap">
                        <span class="operation-tag ${operationTagClass}">${formatOperationType(log.operation_type)}</span>
                    </td>
                    <td class="px-6 py-3 whitespace-nowrap">
                        <span class="result-tag ${resultTagClass}">${resultText}</span>
                    </td>
                    <td class="px-6 py-3 text-sm text-gray-500">${log.remark || '-'}</td>
                `;
                
                fragment.appendChild(row);
            });
            
            // 一次性添加所有行，减少重绘
            tableBody.appendChild(fragment);
        }

        /**
         * 格式化操作类型显示文本
         */
        function formatOperationType(type) {
            const typeMap = {
                'allocate': '分配入住',
                'change': '更换宿舍',
                'swap': '调换宿舍',
                'checkout': '退宿',
                'edit': '信息修改'
            };
            return typeMap[type] || type;
        }

        /**
         * 重置筛选条件
         */
        function resetFilters() {
            document.getElementById('searchUserName').value = '';
            document.getElementById('searchRoom').value = '';
            document.getElementById('filterOperation').value = '';
            document.getElementById('filterResult').value = '';
            document.getElementById('dateRange').value = '';
            
            currentPage = 1;
            // 固定页面高度防止闪烁
            document.body.style.minHeight = `${document.body.offsetHeight}px`;
            filterLogs().then(() => {
                setTimeout(() => {
                    document.body.style.minHeight = '';
                }, 100);
            });
        }

        /**
         * 导出记录
         */
        function exportLogs() {
            if (filteredLogs.length === 0) {
                alert('没有可导出的记录');
                return;
            }
        
            // 显示加载提示
            const exportBtn = document.getElementById('exportBtn');
            const originalText = exportBtn.innerHTML;
            const originalDisabled = exportBtn.disabled;
            exportBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>导出中...';
            exportBtn.disabled = true;
        
            // 准备导出数据
            const exportData = filteredLogs.map((log, index) => {
                return {
                    '序号': index + 1,
                    '操作ID': log.id,
                    '操作时间': log.operation_time ? new Date(log.operation_time).toLocaleString() : '未知',
                    '操作人': log.operator || '系统',
                    '涉及人员': log.user_name,
                    '人员ID': log.user_id,
                    '原房间': log.old_room || '-',
                    '新房间': log.new_room || '-',
                    '操作类型': formatOperationType(log.operation_type),
                    '操作结果': log.result === 'success' ? '成功' : '失败',
                    '备注': log.remark || '-'
                };
            });
        
            // 创建CSV内容
            const headers = Object.keys(exportData[0]).join(',') + '\n';
            const rows = exportData.map(item => 
                Object.values(item).map(value => {
                    // 处理包含逗号的值
                    if (typeof value === 'string' && value.includes(',')) {
                        return `"${value}"`;
                    }
                    return value;
                }).join(',')
            ).join('\n');
            
            const csvContent = headers + rows;
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `住宿操作记录_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
            a.style.visibility = 'hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        
            // 恢复按钮状态
            exportBtn.innerHTML = originalText;
            exportBtn.disabled = originalDisabled;
        }

        /**
         * 状态显示控制函数
         */
        function showLoading() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            
            const loadingEl = document.getElementById('loadingIndicator');
            const others = ['emptyState', 'filterNoResultState', 'errorState'];
            
            loadingEl.classList.remove('hidden');
            others.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }

        function showEmptyState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            
            const emptyEl = document.getElementById('emptyState');
            const others = ['loadingIndicator', 'filterNoResultState', 'errorState'];
            
            emptyEl.classList.remove('hidden');
            others.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function showFilterNoResultState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            
            const filterNoResultEl = document.getElementById('filterNoResultState');
            const others = ['loadingIndicator', 'emptyState', 'errorState'];
            
            filterNoResultEl.classList.remove('hidden');
            others.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function showErrorState() {
            const statusRow = document.getElementById('statusRow');
            statusRow.classList.remove('hidden-row');
            
            const errorEl = document.getElementById('errorState');
            const others = ['loadingIndicator', 'emptyState', 'filterNoResultState'];
            
            errorEl.classList.remove('hidden');
            others.forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        function clearTable() {
            const tableBody = document.getElementById('logTableBody');
            Array.from(tableBody.children).forEach(child => {
                if (child.id !== 'statusRow') tableBody.removeChild(child);
            });
        }

        
    </script>
</body>

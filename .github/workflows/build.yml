name: 自动化打包构建

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_windows:
        description: '构建 Windows 版本'
        required: false
        default: true
        type: boolean
      build_docker:
        description: '构建 Docker 镜像'
        required: false
        default: true
        type: boolean
      build_android:
        description: '构建 Android 版本'
        required: false
        default: true
        type: boolean
      build_synology:
        description: '构建 Synology DSM7 版本'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  APP_NAME: '宿舍管理系统'
  DOCKER_IMAGE_NAME: 'dorm-management-system'
  PYTHONIOENCODING: 'utf-8'

permissions:
  contents: write

jobs:
  # ============================================
  # Windows 平台打包 (PyInstaller + Inno Setup)
  # ============================================
  build-windows:
    name: 🖥️ Windows 打包
    runs-on: windows-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_windows)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔨 创建 data 目录
        run: |
          if (-not (Test-Path "data")) {
            New-Item -ItemType Directory -Path "data" -Force
          }

      - name: 🏗️ PyInstaller 打包 (单文件模式)
        run: |
          pyinstaller Auto_Setup/dorm_management.spec --clean --noconfirm
        continue-on-error: false

      - name: 🏗️ PyInstaller 打包 (多文件模式)
        run: |
          pyinstaller Auto_Setup/dorm_management_multifile.spec --clean --noconfirm
        continue-on-error: false

      - name: 📦 安装 Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: 🌐 下载 Inno Setup 中文语言包
        run: |
          # Inno Setup 6 默认不包含简体中文语言文件，需从官方仓库下载
          $islUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
          $islPath = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri $islUrl -OutFile $islPath -UseBasicParsing
          Write-Host "已下载中文语言包到: $islPath"

      - name: 🔨 Inno Setup 打包 (单文件安装包)
        run: |
          New-Item -ItemType Directory -Path "Auto_Setup\Output" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Auto_Setup\installer_script.iss" /O"Auto_Setup\Output"
          # 重命名避免与多文件安装包冲突
          if (Test-Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0.exe") {
            Move-Item -Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0.exe" -Destination "Auto_Setup\Output\宿舍管理系统_Setup_v1.0_单文件.exe" -Force
          }

      - name: 🔨 Inno Setup 打包 (多文件安装包)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Auto_Setup\installer_script_multifile.iss" /O"Auto_Setup\Output"
          # 重命名多文件安装包
          if (Test-Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0.exe") {
            Rename-Item -Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0.exe" -NewName "宿舍管理系统_Setup_v1.0_多文件.exe"
          }

      - name: 📁 整理输出
        run: |
          # 单文件版
          $singleDir = "dist/windows-single"
          if (-not (Test-Path $singleDir)) { New-Item -ItemType Directory -Path $singleDir -Force }
          if (Test-Path "dist/宿舍管理系统.exe") {
            Move-Item -Path "dist/宿舍管理系统.exe" -Destination $singleDir -Force
          }

          # 多文件版
          $multiDir = "dist/windows-multi"
          if (-not (Test-Path $multiDir)) { New-Item -ItemType Directory -Path $multiDir -Force }
          if (Test-Path "dist/宿舍管理系统") {
            Copy-Item -Path "dist/宿舍管理系统" -Destination $multiDir -Recurse -Force
          }

          # 安装包
          $installerDir = "dist/windows-installer"
          if (-not (Test-Path $installerDir)) { New-Item -ItemType Directory -Path $installerDir -Force }
          if (Test-Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0_单文件.exe") {
            Move-Item -Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0_单文件.exe" -Destination $installerDir -Force
          }
          if (Test-Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0_多文件.exe") {
            Move-Item -Path "Auto_Setup\Output\宿舍管理系统_Setup_v1.0_多文件.exe" -Destination $installerDir -Force
          }

      - name: 📤 上传 Windows 单文件版
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Windows_单文件版
          path: dist/windows-single/
          retention-days: 30

      - name: 📤 上传 Windows 多文件版
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Windows_多文件版
          path: dist/windows-multi/
          retention-days: 30

      - name: 📤 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Windows_安装包
          path: dist/windows-installer/
          retention-days: 30

  # ============================================
  # Docker 镜像构建
  # ============================================
  build-docker:
    name: 🐳 Docker 构建
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_docker)

    permissions:
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔧 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ 构建并导出 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Auto_Setup/dockerfile
          push: false
          outputs: type=docker,dest=docker-image.tar
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 📤 上传 Docker 镜像
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Docker镜像
          path: docker-image.tar
          retention-days: 30

  # ============================================
  # Android 平台打包 (Capacitor WebView)
  # ============================================
  build-android:
    name: 📱 Android 打包
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔧 设置 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ☕ 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 安装 Android 构建工具
        run: |
          # 接受 Android SDK 许可
          yes | sdkmanager --licenses 2>/dev/null || true
          # 安装必要的 SDK 组件
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 🏗️ 初始化 Capacitor 项目
        run: |
          # 创建 Android 项目目录
          mkdir -p android-app/web-src
          cd android-app

          # 初始化 npm 项目
          cat > package.json << 'EOF'
          {
            "name": "dorm-management-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/preferences": "^6.0.0",
              "@capacitor/network": "^6.0.0",
              "@capacitor/splash-screen": "^6.0.0",
              "@capacitor/status-bar": "^6.0.0"
            }
          }
          EOF

          # 安装依赖
          npm install

      - name: 📋 复制 Web 资源
        run: |
          cd android-app

          # 创建 web-src 目录
          mkdir -p web-src

          # 复制项目中预置的 Android 入口页面
          if [ -d "../android/web-src" ]; then
            cp -r ../android/web-src/* web-src/ 2>/dev/null || true
          fi

          # 如果没有预置的 index.html，创建默认入口页面
          if [ ! -f "web-src/index.html" ]; then
            cat > web-src/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>宿舍管理系统</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .container { background: white; border-radius: 16px; padding: 32px 24px; width: 90%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
              .logo { text-align: center; margin-bottom: 24px; }
              .logo h1 { color: #333; font-size: 24px; margin-top: 12px; }
              .form-group { margin-bottom: 16px; }
              .form-group label { display: block; color: #555; font-size: 14px; margin-bottom: 6px; }
              .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; outline: none; }
              .form-group input:focus { border-color: #667eea; }
              .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; }
              .btn:active { transform: scale(0.98); }
              .help-text { color: #999; font-size: 12px; text-align: center; margin-top: 16px; line-height: 1.6; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="logo"><h1>🏠 宿舍管理系统</h1></div>
              <div class="form-group">
                <label for="serverUrl">服务器地址</label>
                <input type="url" id="serverUrl" placeholder="http://192.168.1.100:35168" />
              </div>
              <button class="btn" onclick="connectServer()">连接服务器</button>
              <div class="help-text">请输入服务器IP地址和端口<br/>服务器需运行 Windows 版或 Docker 版<br/>默认端口: 35168</div>
            </div>
            <script>
              async function connectServer() {
                const url = document.getElementById('serverUrl').value.trim();
                if (!url) { alert('请输入服务器地址'); return; }
                try { new URL(url); } catch(e) { alert('地址格式不正确'); return; }
                localStorage.setItem('server_url', url);
                window.location.href = url;
              }
              window.addEventListener('load', () => {
                const saved = localStorage.getItem('server_url');
                if (saved) document.getElementById('serverUrl').value = saved;
              });
            </script>
          </body>
          </html>
          HTMLEOF
          fi

      - name: ⚙️ 初始化 Capacitor 配置
        run: |
          cd android-app

          # 创建 Capacitor 配置文件
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.dorm.management",
            "appName": "宿舍管理系统",
            "webDir": "web-src",
            "server": {
              "androidScheme": "https",
              "allowNavigation": ["*"]
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "backgroundColor": "#667eea",
                "showSpinner": false
              },
              "StatusBar": {
                "style": "LIGHT",
                "backgroundColor": "#667eea"
              }
            }
          }
          EOF

          # 添加 Android 平台
          npx cap add android

      - name: 🔧 自定义 Android 项目配置
        run: |
          cd android-app/android

          # 修改应用图标和启动画面颜色
          if [ -f "app/src/main/res/values/styles.xml" ]; then
            sed -i 's/<item name="android:background">#FFFFFF<\/item>/<item name="android:background">#667eea<\/item>/g' app/src/main/res/values/styles.xml
          fi

          # 确保网络权限
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "INTERNET" app/src/main/AndroidManifest.xml; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' app/src/main/AndroidManifest.xml
            fi
            if ! grep -q "ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' app/src/main/AndroidManifest.xml
            fi
          fi

          # 允许明文 HTTP 传输 (用于局域网连接)
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:networkSecurityConfig=".*"/android:usesCleartextTraffic="true"/g' app/src/main/AndroidManifest.xml
          fi

          # 配置多架构支持 (arm64-v8a, armeabi-v7a, x86, x86_64)
          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            GRADLE_FILE=$(ls app/build.gradle* 2>/dev/null | head -1)
            if [ -n "$GRADLE_FILE" ]; then
              # 在 android { } 块中添加 ndk abiFilters 配置
              if ! grep -q "abiFilters" "$GRADLE_FILE"; then
                sed -i 's/android {/android {\n        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\n        }/' "$GRADLE_FILE"
              fi
            fi
          fi

      - name: 🔄 同步 Capacitor 资源
        run: |
          cd android-app
          npx cap sync android

      - name: 🔑 生成调试签名
        run: |
          cd android-app/android
          # 创建调试密钥库
          keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=CN"

          # 创建 local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 🏗️ 构建 APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📁 整理 APK 输出
        run: |
          mkdir -p dist/android
          if [ -f "android-app/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "dist/android/宿舍管理系统_v1.0.apk"
          fi

      - name: 📤 上传 Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Android
          path: dist/android/
          retention-days: 30

  # ============================================
  # Synology DSM7 SPK 打包 (原生Python, amd64/x86_64)
  # ============================================
  build-synology:
    name: 📦 Synology DSM7 打包
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_synology)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: � 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc default-libmysqlclient-dev libssl-dev libffi-dev \
            libjpeg-dev zlib1g-dev

      - name: 🏗️ 构建 Python 虚拟环境
        run: |
          # 创建虚拟环境
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate

          # 升级pip
          pip install --upgrade pip

          # 过滤掉Synology不需要的GUI依赖（pywebview/pystray需要图形界面）
          grep -v -E '^(pywebview|pystray)' requirements.txt > /tmp/synology-req.txt

          # 安装Python依赖
          pip install -r /tmp/synology-req.txt
          pip install waitress

          # 修复shebang路径，使其指向DSM7安装后的目标路径
          VENV_TARGET="/var/packages/dorm-management-system/target/venv"
          find /tmp/venv/bin -type f -exec sed -i "1s|^#!/tmp/venv|#!${VENV_TARGET}|g" {} \;
          sed -i "s|/tmp/venv|${VENV_TARGET}|g" /tmp/venv/bin/activate

          echo "虚拟环境构建完成"
          du -sh /tmp/venv

      - name: 📦 构建 Synology SPK 包
        run: |
          PKG_NAME="dorm-management-system"
          PKG_DIR="/tmp/spk-build/${PKG_NAME}"

          # 创建 SPK 目录结构
          mkdir -p "${PKG_DIR}/PACKAGE/scripts"
          mkdir -p "${PKG_DIR}/WIZARD_UIFILES"
          mkdir -p "${PKG_DIR}/target/app"
          mkdir -p "${PKG_DIR}/target/var"

          # 复制应用代码（排除不需要的文件）
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.joycode' \
                   --exclude='Auto_Setup' \
                   --exclude='android' \
                   --exclude='*.spec' \
                   --exclude='*.bat' \
                   --exclude='dockerfile' \
                   --exclude='.dockerignore' \
                   --exclude='*.pyc' \
                   --exclude='__pycache__' \
                   ./ "${PKG_DIR}/target/app/"

          # 复制虚拟环境
          cp -r /tmp/venv "${PKG_DIR}/target/venv"

          # ===== 生成套件图标 (72x72 PNG) =====
          python3 -c "
          import struct, zlib
          def create_icon(path):
              # 72x72 紫色渐变图标
              w, h = 72, 72
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w):
                      r = int(102 + (118-102) * x/w)
                      g = int(126 + (75-126) * y/h)
                      b = int(234 + (162-234) * y/h)
                      raw += bytes([r, g, b, 255])
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(sig + ihdr + idat + iend)
          create_icon('${PKG_DIR}/PACKAGE_ICON')
          " 2>/dev/null || {
            # Python生成失败时用base64创建最小PNG
            echo "" | base64 -d > "${PKG_DIR}/PACKAGE_ICON"
          }

          # ===== INFO 文件 (DSM7 包元数据，不能有前导空格) =====
          printf 'package="dorm-management-system"\nversion="1.0.0"\narch="x86_64"\ndescription="宿舍管理系统 - Web端宿舍管理平台，支持水电费管理、房间管理、人员管理等"\nmaintainer="Dorm Management"\ndisplayname="宿舍管理系统"\nos_min_ver="7.0-40000"\nos_max_ver="7.2-99999"\nstartable="yes"\nchangelog="初始版本"\n' > "${PKG_DIR}/INFO"

          # ===== 安装向导 (DSM7 JSON 格式，不能有前导空格) =====
          printf '[\n  {\n    "step_title": "宿舍管理系统 - 安装配置",\n    "items": [\n      {\n        "type": "textfield",\n        "desc": "请设置Web服务端口（默认35168，修改后需确认端口未被占用）",\n        "subitems": [\n          {\n            "key": "pkgwizard_server_port",\n            "desc": "服务端口",\n            "defaultValue": "35168",\n            "validator": {\n              "allowBlank": false,\n              "type": "number",\n              "min": 1024,\n              "max": 65535\n            }\n          }\n        ]\n      },\n      {\n        "type": "multiselect",\n        "desc": "安装说明",\n        "subitems": [\n          {\n            "key": "pkgwizard_note_1",\n            "desc": "本应用为原生Python运行，无需Docker/Container Manager",\n            "defaultValue": true,\n            "disabled": true\n          },\n          {\n            "key": "pkgwizard_note_2",\n            "desc": "安装完成后，通过浏览器访问 http://NAS_IP:端口 使用系统",\n            "defaultValue": true,\n            "disabled": true\n          },\n          {\n            "key": "pkgwizard_note_3",\n            "desc": "默认管理员账号: admin / 密码: admin123，请登录后及时修改",\n            "defaultValue": true,\n            "disabled": true\n          }\n        ]\n      }\n    ]\n  }\n]\n' > "${PKG_DIR}/WIZARD_UIFILES/install_uifile"

          # ===== 安装后脚本 =====
          cat > "${PKG_DIR}/PACKAGE/scripts/postinst" << 'SCRIPTEOF'
          #!/bin/sh
          # 设置虚拟环境和数据目录权限
          PKG_DIR="/var/packages/${SYNOPKG_PKGNAME}/target"
          chmod -R 755 "${PKG_DIR}/venv"
          chmod -R 755 "${PKG_DIR}/app"
          mkdir -p "${PKG_DIR}/data"
          chmod 755 "${PKG_DIR}/data"
          mkdir -p "${PKG_DIR}/var"
          chmod 755 "${PKG_DIR}/var"
          SCRIPTEOF
          chmod +x "${PKG_DIR}/PACKAGE/scripts/postinst"

          # ===== 卸载前脚本 =====
          cat > "${PKG_DIR}/PACKAGE/scripts/preuninst" << 'SCRIPTEOF'
          #!/bin/sh
          # 服务会由DSM自动停止，无需额外操作
          SCRIPTEOF
          chmod +x "${PKG_DIR}/PACKAGE/scripts/preuninst"

          # ===== 卸载后脚本 =====
          cat > "${PKG_DIR}/PACKAGE/scripts/postuninst" << 'SCRIPTEOF'
          #!/bin/sh
          # 数据目录在 /var/packages/ 下，DSM卸载时会自动处理
          SCRIPTEOF
          chmod +x "${PKG_DIR}/PACKAGE/scripts/postuninst"

          # ===== 启动停止状态脚本 =====
          cat > "${PKG_DIR}/PACKAGE/scripts/start-stop-status" << 'SCRIPTEOF'
          #!/bin/sh
          # 宿舍管理系统服务管理脚本 (Synology DSM7 原生Python)

          PKG_DIR="/var/packages/${SYNOPKG_PKGNAME}/target"
          APP_DIR="${PKG_DIR}/app"
          VENV_DIR="${PKG_DIR}/venv"
          PYTHON="${VENV_DIR}/bin/python"
          DATA_DIR="${PKG_DIR}/data"
          LOG_FILE="${PKG_DIR}/var/server.log"
          PID_FILE="${PKG_DIR}/var/server.pid"

          # 读取安装向导中设置的端口，默认 35168
          SERVER_PORT=$(grep -r "pkgwizard_server_port" /var/packages/${SYNOPKG_PKGNAME}/etc/ 2>/dev/null | head -1 | sed 's/.*=//' | tr -d '[:space:]')
          [ -z "${SERVER_PORT}" ] && SERVER_PORT="35168"

          case "$1" in
              start)
                  # 确保目录存在
                  mkdir -p "${DATA_DIR}"
                  mkdir -p "${PKG_DIR}/var"

                  # 设置环境变量
                  export DOCKER_ENV=true
                  export FLASK_ENV=production
                  export SERVER_HOST=0.0.0.0
                  export SERVER_PORT=${SERVER_PORT}
                  export PYTHONPATH="${APP_DIR}"
                  export PYTHONIOENCODING=utf-8

                  # 启动 waitress 服务（后台运行）
                  cd "${APP_DIR}"
                  "${PYTHON}" -c "
          import sys
          sys.path.insert(0, '${APP_DIR}')
          from main import app
          from waitress import serve
          serve(app, host='0.0.0.0', port=${SERVER_PORT}, threads=4)
          " >> "${LOG_FILE}" 2>&1 &

                  # 记录PID
                  echo $! > "${PID_FILE}"

                  # 等待服务启动
                  sleep 3

                  # 检查是否启动成功
                  if kill -0 $(cat "${PID_FILE}") 2>/dev/null; then
                      echo "服务启动成功，访问地址: http://$(hostname -I | awk '{print $1}'):${SERVER_PORT}"
                      exit 0
                  else
                      echo "服务启动失败，请查看日志: ${LOG_FILE}"
                      exit 1
                  fi
                  ;;
              stop)
                  if [ -f "${PID_FILE}" ]; then
                      PID=$(cat "${PID_FILE}")
                      if kill -0 "${PID}" 2>/dev/null; then
                          kill "${PID}" 2>/dev/null
                          # 等待进程退出
                          for i in 1 2 3 4 5; do
                              if ! kill -0 "${PID}" 2>/dev/null; then
                                  break
                              fi
                              sleep 1
                          done
                          # 强制终止
                          kill -9 "${PID}" 2>/dev/null
                      fi
                      rm -f "${PID_FILE}"
                  fi
                  exit 0
                  ;;
              status)
                  if [ -f "${PID_FILE}" ] && kill -0 $(cat "${PID_FILE}") 2>/dev/null; then
                      exit 0  # 运行中
                  else
                      rm -f "${PID_FILE}"
                      exit 1  # 未运行
                  fi
                  ;;
              *)
                  echo "用法: $0 {start|stop|status}"
                  exit 1
                  ;;
          esac
          SCRIPTEOF
          chmod +x "${PKG_DIR}/PACKAGE/scripts/start-stop-status"

          # ===== 打包为 SPK（根目录直接包含 INFO 等文件，不能有外层目录） =====
          mkdir -p dist/synology
          cd "${PKG_DIR}"
          tar -czf "${GITHUB_WORKSPACE}/dist/synology/宿舍管理系统_dsm7_x86_64.spk" \
            INFO PACKAGE_ICON PACKAGE WIZARD_UIFILES target
          echo "SPK 包构建完成"
          ls -lh "${GITHUB_WORKSPACE}/dist/synology/"

      - name: 📤 上传 Synology SPK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}_Synology_DSM7
          path: dist/synology/
          retention-days: 30

  # ============================================
  # 构建总结
  # ============================================
  build-summary:
    name: 📊 构建总结
    runs-on: ubuntu-latest
    needs: [build-windows, build-docker, build-android, build-synology]
    if: always()

    steps:
      - name: 📋 输出构建结果
        run: |
          echo "========================================"
          echo "  宿舍管理系统 - 构建总结"
          echo "========================================"
          echo ""
          echo "Windows 构建:  ${{ needs.build-windows.result }}"
          echo "Docker 构建:   ${{ needs.build-docker.result }}"
          echo "Android 构建:  ${{ needs.build-android.result }}"
          echo "Synology 构建: ${{ needs.build-synology.result }}"
          echo ""
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "✅ Windows 版本构建成功"
          else
            echo "❌ Windows 版本构建失败或被跳过"
          fi
          if [ "${{ needs.build-docker.result }}" = "success" ]; then
            echo "✅ Docker 镜像构建成功"
          else
            echo "❌ Docker 镜像构建失败或被跳过"
          fi
          if [ "${{ needs.build-android.result }}" = "success" ]; then
            echo "✅ Android 版本构建成功"
          else
            echo "❌ Android 版本构建失败或被跳过"
          fi
          if [ "${{ needs.build-synology.result }}" = "success" ]; then
            echo "✅ Synology DSM7 版本构建成功"
          else
            echo "❌ Synology DSM7 版本构建失败或被跳过"
          fi
          echo ""
          echo "========================================"

  # ============================================
  # 发布 Release（仅当推送版本标签时触发）
  # ============================================
  create-release:
    name: 🚀 发布 Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-docker, build-android, build-synology]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        run: |
          # 从 git tag 提取版本号（去掉 refs/tags/ 前缀）
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本标签: $TAG_NAME"
          echo "版本号: $VERSION"

      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: false

      - name: 📁 整理发布文件
        run: |
          mkdir -p release-files

          # 整理 Windows 单文件版
          if [ -d "release-assets/宿舍管理系统_Windows_单文件版" ]; then
            cd release-assets/宿舍管理系统_Windows_单文件版
            for f in *.exe; do
              if [ -f "$f" ]; then
                mv "$f" "../../release-files/宿舍管理系统_${{ steps.version.outputs.version }}_单文件版.exe"
              fi
            done
            cd -
          fi

          # 整理 Windows 多文件版（打包为zip）
          if [ -d "release-assets/宿舍管理系统_Windows_多文件版" ]; then
            cd release-assets/宿舍管理系统_Windows_多文件版
            zip -r "../../release-files/宿舍管理系统_${{ steps.version.outputs.version }}_多文件版.zip" . -x "*.pyc" "__pycache__/*"
            cd -
          fi

          # 整理 Windows 安装包
          if [ -d "release-assets/宿舍管理系统_Windows_安装包" ]; then
            cd release-assets/宿舍管理系统_Windows_安装包
            for f in *.exe; do
              if [ -f "$f" ]; then
                # 替换文件名中的版本号
                new_name=$(echo "$f" | sed "s/v1.0/v${{ steps.version.outputs.version }}/g")
                mv "$f" "../../release-files/$new_name"
              fi
            done
            cd -
          fi

          # 整理 Docker 镜像
          if [ -f "release-assets/宿舍管理系统_Docker镜像/docker-image.tar" ]; then
            mv "release-assets/宿舍管理系统_Docker镜像/docker-image.tar" \
              "release-files/宿舍管理系统_${{ steps.version.outputs.version }}_docker.tar"
          fi

          # 整理 Android APK
          if [ -d "release-assets/宿舍管理系统_Android" ]; then
            cd release-assets/宿舍管理系统_Android
            for f in *.apk; do
              if [ -f "$f" ]; then
                new_name=$(echo "$f" | sed "s/v1.0/v${{ steps.version.outputs.version }}/g")
                mv "$f" "../../release-files/$new_name"
              fi
            done
            cd -
          fi

          # 整理 Synology DSM7 SPK
          if [ -d "release-assets/宿舍管理系统_Synology_DSM7" ]; then
            cd release-assets/宿舍管理系统_Synology_DSM7
            for f in *.spk; do
              if [ -f "$f" ]; then
                new_name=$(echo "$f" | sed "s/v1.0/v${{ steps.version.outputs.version }}/g")
                mv "$f" "../../release-files/$new_name"
              fi
            done
            cd -
          fi

          # 列出所有发布文件
          echo "========== 发布文件列表 =========="
          ls -lh release-files/
          echo "=================================="

      - name: 🚀 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 宿舍管理系统 ${{ steps.version.outputs.tag }}
          body: |
            ## 📦 宿舍管理系统 ${{ steps.version.outputs.tag }}

            ### 下载说明
            - **单文件版**：独立可执行文件，无需安装，直接运行
            - **多文件版**：解压后运行主程序，启动更快
            - **安装包**：Inno Setup 安装程序，自动配置快捷方式和卸载程序
            - **Docker镜像**：`docker load -i 宿舍管理系统_${{ steps.version.outputs.version }}_docker.tar`
            - **Android APK**：安装到安卓设备，连接服务端使用
            - **Synology SPK**：群晖DSM7套件包，原生Python运行，无需Docker/Container Manager，手动安装SPK即可使用

            ### 使用方式
            1. Windows 用户推荐下载安装包，双击安装即可
            2. Docker 用户下载 tar 文件后使用 `docker load` 导入
            3. Android 用户下载 APK 安装后输入服务器地址
            4. 群晖用户下载 SPK 文件，在套件中心 → 手动安装中选择SPK文件安装（无需Docker）
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: 自动化打包构建

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_windows:
        description: '构建 Windows 版本'
        required: false
        default: true
        type: boolean
      build_docker:
        description: '构建 Docker 镜像'
        required: false
        default: true
        type: boolean
      build_android:
        description: '构建 Android APK'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.8'
  APP_NAME: '行政后勤管理系统'
  DOCKER_IMAGE_NAME: 'dorm-management-system'
  PYTHONIOENCODING: 'utf-8'

permissions:
  contents: write

jobs:
  # ============================================
  # Windows 平台打包 (PyInstaller + Inno Setup)
  # ============================================
  build-windows:
    name: 🖥️ Windows 打包
    runs-on: windows-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_windows)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        shell: bash
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: 🐍 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16

      - name: 🔨 创建 data 目录
        run: |
          if (-not (Test-Path "data")) {
            New-Item -ItemType Directory -Path "data" -Force
          }

      - name: 🏗️ PyInstaller 打包 (单文件模式)
        run: |
          pyinstaller Auto_Setup/dorm_management.spec --clean --noconfirm
        continue-on-error: false

      - name: 🏗️ PyInstaller 打包 (多文件模式)
        run: |
          pyinstaller Auto_Setup/dorm_management_multifile.spec --clean --noconfirm
        continue-on-error: false

      - name: 📦 安装 Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: 🌐 下载 Inno Setup 中文语言包
        run: |
          $islUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
          $islPath = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri $islUrl -OutFile $islPath -UseBasicParsing
          Write-Host "已下载中文语言包到: $islPath"

      - name: 🔨 Inno Setup 打包 (单文件安装包)
        run: |
          New-Item -ItemType Directory -Path "Auto_Setup\Output" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Auto_Setup\installer_script.iss" /O"Auto_Setup\Output"
          $version = "${{ steps.version.outputs.version }}"
          $srcFile = "Auto_Setup\Output\行政后勤管理系统_Setup_v1.0.exe"
          if (Test-Path $srcFile) {
            if ($version -ne "") {
              Move-Item -Path $srcFile -Destination "Auto_Setup\Output\DormManagement_Setup_SingleFile_v${version}.exe" -Force
            } else {
              Move-Item -Path $srcFile -Destination "Auto_Setup\Output\DormManagement_Setup_SingleFile.exe" -Force
            }
          }

      - name: 🔨 Inno Setup 打包 (多文件安装包)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Auto_Setup\installer_script_multifile.iss" /O"Auto_Setup\Output"
          $version = "${{ steps.version.outputs.version }}"
          $srcFile = "Auto_Setup\Output\行政后勤管理系统_Setup_v1.0.exe"
          if (Test-Path $srcFile) {
            if ($version -ne "") {
              Rename-Item -Path $srcFile -NewName "DormManagement_Setup_MultiFile_v${version}.exe"
            } else {
              Rename-Item -Path $srcFile -NewName "DormManagement_Setup_MultiFile.exe"
            }
          }

      - name: 📁 整理输出
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # 绿色版·单文件
          $singleDir = "dist/windows-single"
          if (-not (Test-Path $singleDir)) { New-Item -ItemType Directory -Path $singleDir -Force }
          if (Test-Path "dist/行政后勤管理系统.exe") {
            if ($version -ne "") {
              Move-Item -Path "dist/行政后勤管理系统.exe" -Destination "dist/windows-single/DormManagement_Portable_SingleFile_v${version}.exe" -Force
            } else {
              Move-Item -Path "dist/行政后勤管理系统.exe" -Destination "dist/windows-single/DormManagement_Portable_SingleFile.exe" -Force
            }
          }

          # 绿色版·多文件
          $multiDir = "dist/windows-multi"
          if (-not (Test-Path $multiDir)) { New-Item -ItemType Directory -Path $multiDir -Force }
          if (Test-Path "dist/行政后勤管理系统") {
            Copy-Item -Path "dist/行政后勤管理系统" -Destination $multiDir -Recurse -Force
          }

          # 安装版
          $installerDir = "dist/windows-installer"
          if (-not (Test-Path $installerDir)) { New-Item -ItemType Directory -Path $installerDir -Force }
          $singleInstaller = Get-ChildItem -Path "Auto_Setup\Output" -Filter "DormManagement_Setup_SingleFile*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $multiInstaller = Get-ChildItem -Path "Auto_Setup\Output" -Filter "DormManagement_Setup_MultiFile*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($singleInstaller) { Move-Item -Path $singleInstaller.FullName -Destination $installerDir -Force }
          if ($multiInstaller) { Move-Item -Path $multiInstaller.FullName -Destination $installerDir -Force }

      - name: 📤 上传 Windows 绿色版·单文件
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_Windows_Portable_SingleFile
          path: dist/windows-single/
          retention-days: 30

      - name: 📤 上传 Windows 绿色版·多文件
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_Windows_Portable_MultiFile
          path: dist/windows-multi/
          retention-days: 30

      - name: 📤 上传 Windows 安装版
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_Windows_Setup
          path: dist/windows-installer/
          retention-days: 30

      - name: 📦 打包绿色版·多文件为 zip
        if: steps.version.outputs.has_version == 'true'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\windows-multi\*" -DestinationPath "dist\DormManagement_Portable_MultiFile_v${version}.zip"

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 行政后勤管理系统 ${{ steps.version.outputs.tag }}
          body: |

            #### 系统要求
            - Windows 7 SP1（32位或64位）以上系统
            - win7以上需要安装 VC++ 2015-2019 运行时（x86）
            - win7建议安装 Windows 更新 KB2999226
            - 需要安装现代浏览器（Chrome 109+ 或 Firefox 115 ESR 推荐）
            - win7仅支持服务器模式运行
            - **不支持 IE11**
            - win10以上需要安装WebView2 运行时
            - win10以上支持客户端模式和服务器模式

            ### 下载说明
            | 文件 | 说明 |
            |------|------|
            | `DormManagement_Portable_SingleFile_v*.exe` | 单文件绿色版，无需安装，直接运行 |
            | `DormManagement_Portable_MultiFile_v*.zip` | 多文件绿色版，解压后运行主程序，启动更快 |
            | `DormManagement_Setup_SingleFile_v*.exe` | Inno Setup 安装程序（单文件模式），自动配置快捷方式和卸载程序 |
            | `DormManagement_Setup_MultiFile_v*.exe` | Inno Setup 安装程序（多文件模式），自动配置快捷方式和卸载程序 |
            | `DormManagement_Docker_v*.tar` | Docker 镜像，使用 `docker load -i` 导入 |
            | `DormManagement_v*.apk` | Android APK，直接安装运行（最低 Android 8） |

            ### 使用方式
            1. **绿色版**：下载后直接运行，无需安装
            2. **安装版**：双击安装程序，自动配置快捷方式和卸载程序
            3. **Docker**：下载 tar 文件后使用 `docker load -i 文件名.tar` 导入
            4. **Android**：下载 APK 文件后直接安装，允许未知来源安装
          draft: false
          prerelease: false
          files: |
            dist/windows-single/*.exe
            dist/DormManagement_Portable_MultiFile_*.zip
            dist/windows-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Docker 镜像构建
  # ============================================
  build-docker:
    name: 🐳 Docker 构建
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_docker)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: 🔧 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ 构建并导出 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Auto_Setup/dockerfile
          push: false
          outputs: type=docker,dest=docker-image.tar
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 📦 重命名 Docker 镜像文件
        if: steps.version.outputs.has_version == 'true'
        run: |
          mv docker-image.tar "DormManagement_Docker_${{ steps.version.outputs.tag }}.tar"

      - name: 📤 上传 Docker 镜像
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_Docker
          path: |
            DormManagement_Docker_*.tar
            docker-image.tar
          retention-days: 30

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: DormManagement_Docker_*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Android APK 构建（新增）
  # ============================================
  build-android:
    name: 📱 Android 打包
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android)

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 安装 Android SDK 组件
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;26.1.10909125"

      - name: 📦 缓存 Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build
          key: gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: 🔑 解码签名密钥
        if: steps.version.outputs.has_version == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🏗️ 构建 Debug APK（无版本号时）
        if: steps.version.outputs.has_version != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist/android
          cp app/build/outputs/apk/debug/*.apk ../dist/android/DormManagement-debug.apk

      - name: 🏗️ 构建 Release APK（有版本号时）
        if: steps.version.outputs.has_version == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=$(echo "${{ steps.version.outputs.version }}" | tr -d '.') \
            -PversionName="${{ steps.version.outputs.version }}"
          mkdir -p ../dist/android
          cp app/build/outputs/apk/release/*.apk ../dist/android/
          cd ../dist/android
          APK_FILE=$(ls *.apk | head -1)
          mv "$APK_FILE" "DormManagement_v${{ steps.version.outputs.version }}.apk"

      - name: 📤 上传 Android APK
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_Android
          path: dist/android/
          retention-days: 30

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 构建总结
  # ============================================
  build-summary:
    name: 📊 构建总结
    runs-on: ubuntu-latest
    needs: [build-windows, build-docker, build-android]
    if: always()

    steps:
      - name: 📋 输出构建结果
        run: |
          echo "========================================"
          echo "  行政后勤管理系统 - Build Summary"
          echo "========================================"
          echo ""
          echo "Windows 构建: ${{ needs.build-windows.result }}"
          echo "Docker 构建:  ${{ needs.build-docker.result }}"
          echo "Android 构建: ${{ needs.build-android.result }}"
          echo ""
          if [ "${{ needs.build-windows.result }}" = "success" ]; then
            echo "✅ Windows 版本构建成功"
          else
            echo "❌ Windows 版本构建失败或被跳过"
          fi
          if [ "${{ needs.build-docker.result }}" = "success" ]; then
            echo "✅ Docker 镜像构建成功"
          else
            echo "❌ Docker 镜像构建失败或被跳过"
          fi
          if [ "${{ needs.build-android.result }}" = "success" ]; then
            echo "✅ Android APK 构建成功"
          else
            echo "❌ Android APK 构建失败或被跳过"
          fi
          echo ""
          echo "========================================"
name: iOS 打包构建

on:
  push:
    branches: [ main, master, 2 ]
    paths:
      - 'ios/**'
      - 'blueprints/**'
      - 'models/**'
      - 'utils/**'
      - 'templates/**'
      - 'static/**'
      - 'main.py'
      - 'config.py'
      - 'ios-requirements.txt'
      - '.github/workflows/ios-build.yml'
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  IOS_PYTHON_VERSION: '3.11'

permissions:
  contents: write

jobs:
  build-ios:
    name: 📱 iOS 打包
    runs-on: macos-14

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🔖 提取版本号
        id: version
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本号: $TAG_NAME"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到版本号，跳过发布"
          fi

      - name: 🐍 设置 Python ${{ env.IOS_PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.IOS_PYTHON_VERSION }}

      - name: 🖼️ 生成 iOS 应用图标
        run: |
          pip install Pillow
          python -c "
          from PIL import Image
          img = Image.open('static/favicon.ico')
          if img.mode != 'RGBA':
              img = img.convert('RGBA')
          img = img.resize((1024, 1024), Image.LANCZOS)
          img.save('ios/DormManagement/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png')
          print('iOS icon generated: 1024x1024')
          "

      - name: 📦 安装 kivy-ios
        run: |
          python -m pip install --upgrade pip
          # kivy-ios 2025.5.17：用 shutil.which 替代 sh.which，已兼容 sh 2.x
          # 锁定 sh==1.14.3 与 kivy-ios 官方 requirements.txt 一致，避免 sh 2.x 潜在差异
          # libffi recipe 升级到 3.4.8 并移除 bitcode，修复 Xcode 15 构建失败问题
          # Cython==3.0.11 与 kivy-ios CythonRecipe.hostpython_prerequisites 一致
          pip install "kivy-ios==2025.5.17" "sh==1.14.3" "Cython==3.0.11"

      - name: 🔧 安装 kivy-ios toolchain 系统依赖
        run: |
          brew install ccache libjpeg autoconf automake libtool pkg-config
          brew link libtool

      - name: 💾 缓存 kivy-ios 工具链
        uses: actions/cache@v6
        with:
          path: ios/kivy-ios-work
          key: kivy-ios-toolchain-v3
          restore-keys: kivy-ios-toolchain-

      - name: 🍎 编译 Python.framework
        run: |
          # 调用项目内构建脚本（toolchain build python3 + 手动构建 framework）
          # kivy-ios 2025.5.17 无 create-framework 命令，脚本内用 clang 从静态库手动构建
          cd ios
          chmod +x build_python_framework.sh
          ./build_python_framework.sh

      - name: 📦 安装纯 Python 依赖
        run: |
          # 定位 framework 内的 site-packages
          SITE_PACKAGES=$(find ios/Frameworks/Python.framework -path "*/site-packages" -type d | head -1)
          echo "site-packages: $SITE_PACKAGES"
          # ios-requirements.txt 仅含纯 Python 包（cryptography/Pillow 已移除）
          pip install --target "$SITE_PACKAGES" -r ios-requirements.txt --no-deps

      - name: 🏗️ Xcode 构建 Archive（无签名）
        run: |
          cd ios
          xcodebuild -project DormManagement.xcodeproj \
            -scheme DormManagement \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DormManagement.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean archive

      - name: 📦 导出未签名 IPA
        run: |
          # 无签名，直接从 archive 复制 .app 打包为 IPA
          mkdir -p ios/build/Payload
          cp -r ios/build/DormManagement.xcarchive/Products/Applications/DormManagement.app ios/build/Payload/
          cd ios/build
          zip -r DormManagement-ios.ipa Payload

      - name: 🏷️ 重命名 IPA（带版本号）
        if: steps.version.outputs.has_version == 'true'
        run: mv ios/build/DormManagement-ios.ipa "ios/build/DormManagement_v${{ steps.version.outputs.version }}.ipa"

      - name: 📤 上传 iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: DormManagement_iOS
          path: ios/build/*.ipa
          retention-days: 30

      - name: 🚀 发布到 Release
        if: steps.version.outputs.has_version == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ios/build/*.ipa
          append_body: true
          body: |
            ### iOS 版本说明
            | 文件 | 说明 |
            |------|------|
            | `DormManagement_v*.ipa` | iOS 未签名 IPA，需自签名后通过 TrollStore / Sideloadly / AltStore 安装 |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
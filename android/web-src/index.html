<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宿舍管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo .icon-wrapper {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .logo .icon-wrapper svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    .logo h1 {
      color: #333;
      font-size: 22px;
      font-weight: 600;
    }
    .logo p {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      color: #555;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px 12px 36px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      -webkit-appearance: none;
    }
    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #f5f5f5;
      color: #555;
      margin-top: 12px;
    }
    .btn-secondary:active {
      background: #eee;
    }
    .status {
      text-align: center;
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1565c0;
      display: block;
    }
    .help-text {
      color: #999;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
      line-height: 1.8;
    }
    .history-section {
      margin-top: 20px;
      border-top: 1px solid #f0f0f0;
      padding-top: 16px;
    }
    .history-title {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .history-item:active {
      background: #e9ecef;
    }
    .history-item .url {
      color: #555;
      font-size: 14px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item .delete {
      color: #dc3545;
      font-size: 18px;
      margin-left: 12px;
      padding: 0 4px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #1565c0;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 2.84L18 12v7h-2v-6H8v6H6v-7l6-6.16z"/>
        </svg>
      </div>
      <h1>宿舍管理系统</h1>
      <p>移动客户端</p>
    </div>

    <div class="form-group">
      <label for="serverUrl">服务器地址</label>
      <div class="input-wrapper">
        <span class="prefix">🌐</span>
        <input type="url" id="serverUrl" placeholder="192.168.1.100:35168" autocapitalize="none" autocorrect="off" />
      </div>
    </div>

    <button class="btn" id="connectBtn" onclick="connectServer()">连接服务器</button>
    <button class="btn btn-secondary" onclick="loadSavedServer()">使用上次地址</button>

    <div id="status" class="status"></div>

    <div id="historySection" class="history-section" style="display:none;">
      <div class="history-title">历史记录</div>
      <div id="historyList"></div>
    </div>

    <div class="help-text">
      请输入服务器IP地址和端口<br/>
      服务器需运行 Windows 版或 Docker 版<br/>
      默认端口: 35168<br/>
      确保手机与服务器在同一网络
    </div>
  </div>

  <script>
    // Capacitor Preferences API
    let Preferences = null;
    let Network = null;

    async function initCapacitor() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins) {
          Preferences = window.Capacitor.Plugins.Preferences;
          Network = window.Capacitor.Plugins.Network;
        }
      } catch(e) {
        console.log('Capacitor not available, using localStorage fallback');
      }
    }

    // 保存服务器地址
    async function saveServerUrl(url) {
      try {
        if (Preferences) {
          await Preferences.set({ key: 'server_url', value: url });
        }
      } catch(e) {}
      localStorage.setItem('server_url', url);

      // 保存到历史记录
      let history = JSON.parse(localStorage.getItem('server_history') || '[]');
      history = history.filter(h => h !== url);
      history.unshift(url);
      history = history.slice(0, 5); // 最多保存5条
      localStorage.setItem('server_history', JSON.stringify(history));
    }

    // 获取保存的服务器地址
    async function getSavedServerUrl() {
      try {
        if (Preferences) {
          const { value } = await Preferences.get({ key: 'server_url' });
          if (value) return value;
        }
      } catch(e) {}
      return localStorage.getItem('server_url');
    }

    // 格式化URL
    function formatUrl(input) {
      let url = input.trim();
      if (!url) return null;

      // 如果没有协议前缀，添加 http://
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      return url;
    }

    // 验证URL
    function validateUrl(url) {
      try {
        new URL(url);
        return true;
      } catch(e) {
        return false;
      }
    }

    // 测试服务器连接
    async function testConnection(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const response = await fetch(url, {
          method: 'HEAD',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch(e) {
        // no-cors 模式下即使连接成功也可能抛出错误
        // 所以我们假设如果 fetch 没有超时，服务器可能是可达的
        return true;
      }
    }

    // 连接服务器
    async function connectServer() {
      const input = document.getElementById('serverUrl').value.trim();
      const url = formatUrl(input);

      if (!url) {
        showStatus('请输入服务器地址', 'error');
        return;
      }

      if (!validateUrl(url)) {
        showStatus('地址格式不正确，请输入完整地址（如 192.168.1.100:35168）', 'error');
        return;
      }

      const btn = document.getElementById('connectBtn');
      btn.disabled = true;
      showStatus('<span class="spinner"></span>正在连接服务器...', 'loading');

      try {
        await saveServerUrl(url);
        // 直接跳转
        window.location.href = url;
      } catch(e) {
        showStatus('连接失败: ' + e.message, 'error');
        btn.disabled = false;
      }
    }

    // 加载保存的服务器地址
    async function loadSavedServer() {
      const savedUrl = await getSavedServerUrl();
      if (savedUrl) {
        document.getElementById('serverUrl').value = savedUrl.replace(/^https?:\/\//, '');
        showStatus('已加载保存的地址', 'success');
      } else {
        showStatus('没有保存的服务器地址', 'error');
      }
    }

    // 显示状态消息
    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.innerHTML = msg;
      el.className = 'status ' + type;
    }

    // 渲染历史记录
    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('server_history') || '[]');
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = history.map(url => `
        <div class="history-item" onclick="selectHistory('${url.replace(/'/g, "\\'")}')">
          <span class="url">${url.replace(/^https?:\/\//, '')}</span>
          <span class="delete" onclick="event.stopPropagation(); deleteHistory('${url.replace(/'/g, "\\'")}')">×</span>
        </div>
      `).join('');
    }

    // 选择历史记录
    function selectHistory(url) {
      document.getElementById('serverUrl').value = url.replace(/^https?:\/\//, '');
      showStatus('已选择地址', 'success');
    }

    // 删除历史记录
    function deleteHistory(url) {
      let history = JSON.parse(localStorage.getItem('server_history') || '[]');
      history = history.filter(h => h !== url);
      localStorage.setItem('server_history', JSON.stringify(history));
      renderHistory();
    }

    // 页面加载时初始化
    window.addEventListener('load', async () => {
      await initCapacitor();

      // 加载保存的服务器地址
      const savedUrl = await getSavedServerUrl();
      if (savedUrl) {
        document.getElementById('serverUrl').value = savedUrl.replace(/^https?:\/\//, '');
      }

      // 渲染历史记录
      renderHistory();

      // 监听网络状态
      if (Network) {
        try {
          const status = await Network.getStatus();
          if (!status.connected) {
            showStatus('网络未连接，请检查网络设置', 'error');
          }
        } catch(e) {}
      }
    });

    // 回车键连接
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        connectServer();
      }
    });
  </script>
</body>
</html>
